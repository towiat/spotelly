<!doctype html>
<html data-bs-theme="dark">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotelly Configuration</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
  </head>

  <body>
    <div class="d-flex flex-column align-items-center">
      <form>
        <div>
          <!-- General settings card -->
          <div class="card mt-3 p-3 border-3">
            <h5 class="card-title text-center mb-3">Settings</h5>
            <!-- Bidding zone dropdown -->
            <div class="row mb-3">
              <label for="b" class="col-6 col-form-label text-end">Bidding Zone</label>
              <div class="col-3">
                <select class="form-select" id="b" required>
                  <option>AT</option>
                  <option>BE</option>
                  <option>BG</option>
                  <option>CH</option>
                  <option>CZ</option>
                  <option>DE-LU</option>
                  <option>DK1</option>
                  <option>DK2</option>
                  <option>EE</option>
                  <option>ES</option>
                  <option>FI</option>
                  <option>FR</option>
                  <option>GR</option>
                  <option>HR</option>
                  <option>HU</option>
                  <option>IT-Calabria</option>
                  <option>IT-Centre-North</option>
                  <option>IT-Centre-South</option>
                  <option>IT-North</option>
                  <option>IT-Sardinia</option>
                  <option>IT-Sicily</option>
                  <option>IT-South</option>
                  <option>LT</option>
                  <option>LV</option>
                  <option>ME</option>
                  <option>NL</option>
                  <option>NO1</option>
                  <option>NO2</option>
                  <option>NO3</option>
                  <option>NO4</option>
                  <option>NO5</option>
                  <option>PL</option>
                  <option>PT</option>
                  <option>RO</option>
                  <option>RS</option>
                  <option>SE1</option>
                  <option>SE2</option>
                  <option>SE3</option>
                  <option>SE4</option>
                  <option>SI</option>
                  <option>SK</option>
                </select>
              </div>
            </div>

            <!-- Mode selection dropdown -->
            <div class="row mb-3">
              <label for="i" class="col-6 col-form-label text-end">Mode</label>
              <div class="col-3">
                <select class="form-select" id="i" required>
                  <option value="3600000">60-minute</option>
                  <option value="900000">15-minute</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Price Modifier card -->
          <div class="card mt-3 p-3 border-3">
            <h5 class="card-title text-center">Price Modifier</h5>
            <div class="w-100" id="u" style="background: #f0f0f0"></div>
            <div class="w-100" id="p"></div>
            <div class="w-100" id="d" style="background: #f0f0f0"></div>
            <div class="alert alert-danger text-center d-none" id="a"></div>
          </div>

          <!-- Switch card container -->
          <div id="s"></div>

          <!-- Submit button -->
          <div class="d-flex justify-content-center p-3">
            <button type="button" class="btn btn-primary" id="o">
              <span class="spinner-border spinner-border-sm d-none"></span>
              <span>Submit</span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Template for switch card -->
    <template id="w">
      <div class="card mt-3 p-3 border-3">
        <h5 class="card-title text-center"></h5>
        <table class="table">
          <thead>
            <tr class="text-center">
              <th style="width: 12ch">From</th>
              <th style="width: 12ch">To</th>
              <th style="width: 15ch">Type</th>
              <th style="width: 14ch">Duration</th>
              <th style="width: 13ch">Prices</th>
              <th style="width: 10ch">Limit</th>
              <th style="width: 5ch"></th>
            </tr>
          </thead>
          <tbody>
            <tr class="text-center">
              <td class="border-bottom-0" colspan="7">
                <button type="button" class="btn btn-primary" name="a">Add Time Window</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="bg-body text-muted">
          <div class="form-check">
            <label class="form-check-label">Invert Switch</label>
            <input type="checkbox" class="form-check-input" name="i" />
          </div>
        </div>
      </div>
    </template>

    <!-- Template for table row -->
    <template id="r">
      <tr name="x">
        <!-- from -->
        <td>
          <select class="form-select text-end" dir="rtl" name="v"></select>
        </td>
        <!-- to -->
        <td>
          <select class="form-select text-end" dir="rtl" name="v"></select>
        </td>
        <!-- type -->
        <td>
          <select class="form-select" name="v">
            <option value="0">block</option>
            <option value="1">non-block</option>
          </select>
        </td>
        <!-- duration -->
        <td>
          <select class="form-select text-end" dir="rtl" name="v"></select>
        </td>
        <!-- price selection -->
        <td>
          <select class="form-select" name="v">
            <option value="0">lowest</option>
            <option value="1">highest</option>
          </select>
        </td>
        <!-- price limit -->
        <td>
          <input
            type="text"
            class="form-control text-end"
            name="v"
            pattern="[+\-]?(\d+\.?\d*|\.\d+)"
            title="Number"
          />
        </td>
        <!-- remove button -->
        <td class="text-center align-middle">
          <button type="button" class="btn btn-sm btn-outline-danger rm" title="Remove row">
            &times;
          </button>
        </td>
      </tr>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.6/src-min/ace.min.js"></script>
    <script>
      const q = (ele, string) => ele.querySelector(string);
      const setButton = (button, on) => {
        button.disabled = !on;
        button.classList.toggle("bg-danger", !on);
      };

      const body = document.body;

      const biddingZone = q(body, "#b");
      const codeAlert = q(body, "#a");
      const form = q(body, "form");
      const interval = q(body, "#i");
      const rowTemplate = q(body, "#r").content;
      const spinner = q(body, ".spinner-border");
      const submitButton = q(body, "#o");
      const switchCardTemplate = q(body, "#w").content;
      const switchDiv = q(body, "#s");

      const [fromSelect, toSelect, , durationSelect] = rowTemplate.querySelectorAll("[name=v]");

      const aceOptions = {
        fontSize: "0.9em",
        highlightActiveLine: false,
        highlightGutterLine: false,
        maxLines: 30,
        mode: "ace/mode/javascript",
        printMargin: false,
        readOnly: true,
        showFoldWidgets: false,
        showLineNumbers: false,
        tabSize: 2,
        useWorker: false,
      };

      // build a timestring in the form HH:MM for a given second of the day
      const ts = s => `${Math.floor(s / 3600)}:${((s % 3600) / 60).toString().padStart(2, 0)}`;

      // build a duration string in the form "3h 45m" for a given number of seconds
      const ds = s =>
        `${s < 3600 ? "" : ((s / 3600) | 0) + "h "}${s % 3600 ? (s % 3600) / 60 + "m" : ""}`.trim();

      let conf = null;

      // remove row and add time window button
      switchDiv.addEventListener("click", e => {
        if (e.target.matches(".rm")) {
          const tr = e.target.closest("tr");
          if (tr) tr.remove();
        } else if (e.target.matches("[name=a]")) {
          e.target.closest("tr").before(createRow([0, 1, 0, 1, 0, ""]));
        }
        checkLimits();
      });

      // if mode is changed, remove all time windows and update dropdowns
      interval.addEventListener("change", resetRows);

      // delete all time windows and set the dropdown options for the selected mode
      function resetRows() {
        switchDiv.querySelectorAll("[name=x]").forEach(e => e.remove());
        fromSelect.innerHTML = "";
        toSelect.innerHTML = "";
        durationSelect.innerHTML = "";
        const intervalSeconds = Number(interval.value) / 1000;
        for (let i = 0, j = 0; i < 86400; i += intervalSeconds, j++) {
          fromSelect.add(new Option(ts(i), j));
          toSelect.add(new Option(ts(i + intervalSeconds), j + 1));
          durationSelect.add(new Option(ds(i + intervalSeconds), j + 1));
        }
      }

      // create a time window row
      function createRow(row) {
        const tr = rowTemplate.cloneNode(true);
        tr.querySelectorAll("[name=v]").forEach((ele, idx) => (ele.value = String(row[idx])));
        return tr;
      }

      // read only editor for the first line of the price modifier
      ace.edit("u", aceOptions).setValue("function priceModifier (datetime, spotPrice) {", -1);

      // read only editor for the last line of the price modifier
      ace.edit("d", aceOptions).setValue("}", -1);

      // main edit window for the price modifier
      const editor = ace.edit("p", { ...aceOptions, readOnly: false, useWorker: true });

      // show alert if the price modifier has a syntax error or exceeds the storage limit
      // (1024 bytes for the JSON string stored on the Shelly); returns true if the code is ok
      function checkCode() {
        const code = editor.getValue();
        let msg = "";
        try {
          new Function(code);
        } catch (e) {
          msg = e.message;
        }
        if (new Blob([JSON.stringify(code)]).size > 1024) msg = "Size limit (1024 bytes) exceeded!";
        codeAlert.innerText = msg;
        codeAlert.classList.toggle("d-none", !msg);
        return !msg;
      }

      editor.on("change", checkCode);

      // when called for the first time, add a card for each switch; then update UI with config data
      function updateUI() {
        if (!switchDiv.children.length) {
          conf.w.forEach((_, idx) => {
            const switchCard = switchCardTemplate.cloneNode(true);
            q(switchCard, "h5").innerText = `Switch ${idx}`;
            switchDiv.appendChild(switchCard);
          });
        }

        biddingZone.value = conf.c.b;
        interval.value = conf.c.i;
        editor.setValue(conf.p, 1);
        resetRows();
        conf.w.forEach((timeWindows, idx) => {
          for (const timeWindow of timeWindows) {
            q(switchDiv.children[idx], "[name=a]").closest("tr").before(createRow(timeWindow));
          }
          q(switchDiv.children[idx], "[name=i]").checked = conf.c.s[idx];
        });
        checkLimits();
      }

      // disable add/submit buttons if needed
      function checkLimits() {
        const windowCount = switchDiv.querySelectorAll("[name=x]").length;
        // disable add buttons if we have 30 or more time windows
        switchDiv.querySelectorAll("[name=a]").forEach(button => {
          setButton(button, windowCount < 30);
          button.innerText =
            windowCount < 30 ? "Add Time Window" : "Time Window Limit (30) reached!";
        });
        // submit button is only enabled if at least one time window is defined
        setButton(submitButton, windowCount);
      }

      // submit the form
      submitButton.addEventListener("click", () => {
        // "to" must be later than "from" and duration must fit into the time window
        switchDiv.querySelectorAll("[name=x]").forEach(row => {
          const [f, t, , d] = row.querySelectorAll("[name=v]");
          t.setCustomValidity(+t.value > +f.value ? "" : "Must be later than From");
          d.setCustomValidity(d.value > t.value - f.value ? "Longer than time window" : "");
        });
        if (!form.reportValidity() || !checkCode()) {
          return;
        }

        submitButton.disabled = true;
        spinner.classList.toggle("d-none", false);
        setTimeout(() => {
          spinner.classList.toggle("d-none", true);
          submitButton.disabled = false;
        }, 5000);

        conf.c.b = biddingZone.value;
        conf.c.i = Number(interval.value);
        conf.p = editor.getValue();

        conf.w = [...switchDiv.children].map(switchCard =>
          [...switchCard.querySelectorAll("[name=x]")].map(row =>
            [...row.querySelectorAll("[name=v]")].map(
              (e, idx) => (idx - 5 ? +e.value : e.value), //awkward, but limit must be a string
            ),
          ),
        );

        conf.c.s = [...switchDiv.querySelectorAll("[name=i]")].map(e => e.checked);
        callDataEndpoint(conf);
      });

      function callDataEndpoint(postData) {
        fetch(
          window.location.href.replace("config", "confdata"),
          postData && { method: "POST", body: JSON.stringify(postData) },
        )
          .then(r => r.json())
          .then(r => {
            conf = r;
            updateUI();
          })
          .catch(e => (body.innerHTML = e));
      }

      window.addEventListener("load", () => callDataEndpoint());
    </script>
  </body>
</html>
